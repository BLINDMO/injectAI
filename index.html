<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="#000000" />
  <title>injectAI</title>
  <style>
    :root {
      --bg: #000;
      --fg: #d6dbd6;
      --muted: #7c887c;
      --accent: #4cd07a;
      --accent2: #57c7d4;
      --key: #16181a;
      --key2: #232629;
      --keyline: #2b2f33;
      --green: #4cd07a; --brightgreen: #74f29a;
      --red: #ff6b66; --brightred: #ff9b95;
      --yellow: #e6c25a; --brightyellow: #ffd874;
      --blue: #6fa8ff; --brightblue: #9cc4ff;
      --cyan: #57c7d4; --brightcyan: #84e6f0;
      --magenta: #c98be0; --grey: #6f7a6f; --white: #f0f4f0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      overflow: hidden; overscroll-behavior: none;
    }
    body {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      padding-top: env(safe-area-inset-top);
      -webkit-user-select: none; user-select: none;
    }
    #screen {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px 4px;
    }
    #out .line { white-space: pre-wrap; word-break: break-word; }
    #liveline {
      flex: 0 0 auto; white-space: pre-wrap; word-break: break-word;
      padding: 2px 14px 8px; min-height: 1.5em;
    }
    .buf { color: var(--white); }
    .cur {
      display: inline-block; width: 8px; height: 1.05em; vertical-align: text-bottom;
      background: var(--accent); margin-left: 1px; animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* tappable command links */
    .tap {
      color: var(--accent2); border-bottom: 1px solid rgba(87,199,212,.35);
      padding: 1px 0; cursor: pointer;
    }
    .tap.cmd { color: var(--brightgreen); border-bottom-color: rgba(116,242,154,.4); }
    .tap:active { opacity: .6; }
    .pill {
      display: inline-block; color: var(--brightgreen);
      border: 1px solid var(--keyline); border-radius: 6px;
      padding: 4px 10px; margin: 3px 6px 3px 0; cursor: pointer;
    }
    .pill:active { background: var(--key2); }

    /* on-screen keyboard */
    #keyboard {
      flex: 0 0 auto; background: #050606; border-top: 1px solid var(--keyline);
      padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 9px;
      touch-action: manipulation;
    }
    .kbrow { display: flex; gap: 7px; justify-content: center; }
    .key {
      flex: 1 1 0; min-width: 0; height: 62px;
      background: var(--key2); color: var(--white);
      border: 1px solid var(--keyline); border-radius: 10px;
      font: inherit; font-size: 21px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 0; cursor: pointer; user-select: none;
      box-shadow: 0 2px 0 #000;
    }
    .key:active { transform: translateY(1px); }
    .key.mod { background: var(--key); color: var(--muted); font-size: 16px; flex: 0 0 14%; }
    .key.act { background: var(--key); color: var(--accent2); font-size: 14px; height: 44px; }
    .key.space { flex: 1 1 44%; color: var(--muted); font-size: 16px; }
    .key.enter { color: var(--bg); background: var(--accent); border-color: var(--accent); flex: 0 0 26%; font-weight: 600; }
    .key.on { background: var(--accent); color: #000; border-color: var(--accent); }
    .key.press { background: var(--accent2); color: #000; }
    @media (min-width: 760px) {
      #keyboard { max-width: 780px; margin: 0 auto; width: 100%; }
      .key { height: 50px; font-size: 18px; }
    }

    /* colours */
    .green { color: var(--green); } .brightgreen { color: var(--brightgreen); }
    .red { color: var(--red); } .brightred { color: var(--brightred); }
    .yellow { color: var(--yellow); } .brightyellow { color: var(--brightyellow); }
    .blue { color: var(--blue); } .brightblue { color: var(--brightblue); }
    .cyan { color: var(--cyan); } .brightcyan { color: var(--brightcyan); }
    .magenta { color: var(--magenta); } .grey { color: var(--grey); }
    .white { color: var(--white); } .accent { color: var(--accent); }
    .bold { font-weight: 600; } .dim { opacity: .7; }
    body.nocolour [class*="green"], body.nocolour [class*="red"], body.nocolour [class*="yellow"],
    body.nocolour [class*="blue"], body.nocolour [class*="cyan"], body.nocolour [class*="magenta"],
    body.nocolour .grey, body.nocolour .white, body.nocolour .accent { color: var(--fg) !important; }

    #screen::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="screen"><div id="out"></div></div>
  <div id="liveline"></div>
  <div id="keyboard"></div>

  <script src="world.js"></script>
  <script src="app.js"></script>
  <script src="console.js"></script>
</body>
</html>
